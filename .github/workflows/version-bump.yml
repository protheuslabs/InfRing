name: Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel used when writing runtime version metadata
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - stable
      dry_run:
        description: Plan the release without creating tags/releases or writing version files
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    if: ${{ github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.REPO_ADMIN_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Refresh git tags
        run: git fetch --force --tags origin

      - name: Enforce conventional commit prefixes before versioning
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && ! printf '%s' "${BEFORE_SHA}" | grep -Eq '^0+$'; then
            node client/runtime/lib/ts_entrypoint.ts tests/tooling/scripts/ci/conventional_commit_gate.ts \
              --from="${BEFORE_SHA}" \
              --to="${HEAD_SHA}" \
              --strict=1 \
              --out=core/local/artifacts/version_bump_commit_gate_current.json
          else
            node client/runtime/lib/ts_entrypoint.ts tests/tooling/scripts/ci/conventional_commit_gate.ts \
              --to=HEAD \
              --strict=1 \
              --out=core/local/artifacts/version_bump_commit_gate_current.json
          fi

      - name: Resolve release channel
        id: channel
        env:
          RELEASE_CHANNEL_INPUT: ${{ github.event.inputs.release_channel }}
        run: |
          set -euo pipefail
          CHANNEL_INPUT="${RELEASE_CHANNEL_INPUT:-}"
          if [ -z "$CHANNEL_INPUT" ]; then
            CHANNEL_INPUT="$(node -e 'const fs=require("fs");let ch="alpha";try{const p=JSON.parse(fs.readFileSync("client/runtime/config/release_channel_policy.json","utf8"));if(typeof p.default_channel==="string"&&p.default_channel.trim()) ch=p.default_channel.trim().toLowerCase();}catch{};if(!["alpha","beta","stable"].includes(ch)) ch="alpha";process.stdout.write(ch);')"
          fi
          echo "release_channel=${CHANNEL_INPUT}" >> "$GITHUB_OUTPUT"
          echo "Release channel: ${CHANNEL_INPUT}"

      - name: Resolve semantic version bump from conventional commits
        id: semver
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.release_channel }}
        run: |
          set -euo pipefail
          mkdir -p core/local/artifacts
          DRY_RUN="${DRY_RUN_INPUT:-false}"
          cargo run --quiet --manifest-path core/layer0/ops/Cargo.toml --bin infring-ops -- release-semver-contract run \
            --strict=1 \
            --write=0 \
            --channel=${{ steps.channel.outputs.release_channel }} \
            > core/local/artifacts/version_bump_plan_current.json
          cat core/local/artifacts/version_bump_plan_current.json
          CHANNEL_SUFFIX=""
          if [ "${RELEASE_CHANNEL}" != "stable" ]; then
            CHANNEL_SUFFIX="-${RELEASE_CHANNEL}"
          fi
          HEAD_RELEASE_TAG="$(git tag --points-at HEAD | grep -E "^v[0-9]+\\.[0-9]+\\.[0-9]+${CHANNEL_SUFFIX}$" | sort -V | tail -n 1 || true)"
          export HEAD_RELEASE_TAG
          node <<'NODE' > core/local/artifacts/version_bump_outputs.env
          const fs = require("fs");
          const p = JSON.parse(fs.readFileSync("core/local/artifacts/version_bump_plan_current.json", "utf8"));
          const eventName = String(process.env.EVENT_NAME || "");
          const rawChannel = String(process.env.RELEASE_CHANNEL || "alpha").trim().toLowerCase();
          const channel = ["alpha", "beta", "stable"].includes(rawChannel) ? rawChannel : "alpha";
          const headReleaseTag = String(process.env.HEAD_RELEASE_TAG || "").trim();
          let releaseReady = Boolean(p.release_ready);
          let tag = String(p.next_tag || "none");
          let nextVersion = String(p.next_version || "0.0.0");
          let bump = String(p.bump || "none");
          let syntheticPerCommitRelease = false;
          if (!releaseReady && eventName === "push" && headReleaseTag) {
            tag = headReleaseTag;
            const match = headReleaseTag.match(/^v([0-9]+)\.([0-9]+)\.([0-9]+)/);
            if (match) {
              nextVersion = `${match[1]}.${match[2]}.${match[3]}`;
            }
            bump = "none";
            releaseReady = true;
          } else if (!releaseReady && eventName === "push") {
            const current = String(p.current_version || "0.0.0").split(/[+-]/)[0];
            const parts = current.split(".").map((part) => Number.parseInt(part, 10));
            const major = Number.isFinite(parts[0]) ? parts[0] : 0;
            const minor = Number.isFinite(parts[1]) ? parts[1] : 0;
            const patch = Number.isFinite(parts[2]) ? parts[2] : 0;
            nextVersion = `${major}.${minor}.${patch + 1}`;
            tag = `v${nextVersion}${channel === "stable" ? "" : `-${channel}`}`;
            bump = "patch";
            releaseReady = true;
            syntheticPerCommitRelease = true;
          }
          const emit = (key, value) => console.log(`${key}=${String(value).replace(/\n/g, "")}`);
          emit("RELEASE_READY", releaseReady ? "1" : "0");
          emit("TAG", tag);
          emit("NEXT_VERSION", nextVersion);
          emit("BUMP", bump);
          emit("SYNTHETIC_PER_COMMIT_RELEASE", syntheticPerCommitRelease ? "1" : "0");
          NODE
          cat core/local/artifacts/version_bump_outputs.env
          . core/local/artifacts/version_bump_outputs.env
          echo "release_ready=${RELEASE_READY}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "synthetic_per_commit_release=${SYNTHETIC_PER_COMMIT_RELEASE}" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=1" >> "$GITHUB_OUTPUT"
          else
            echo "dry_run=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload version bump plan
        uses: actions/upload-artifact@v4
        with:
          name: version-bump-plan
          path: core/local/artifacts/version_bump_plan_current.json
          if-no-files-found: error

      - name: Stop when no releasable conventional commits
        if: steps.semver.outputs.release_ready != '1'
        run: |
          echo "No releasable commit found. Prefixed main pushes synthesize a patch release when semantic bumping has no release."
          exit 0

      - name: Stop after dry run
        if: steps.semver.outputs.release_ready == '1' && steps.semver.outputs.dry_run == '1'
        run: |
          echo "Dry run only. Planned ${{ steps.semver.outputs.bump }} bump to ${{ steps.semver.outputs.tag }}."
          exit 0

      - name: Create release tag for asset-owning release workflow
        if: steps.semver.outputs.release_ready == '1' && steps.semver.outputs.dry_run != '1'
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN || github.token }}
          RELEASE_TAG: ${{ steps.semver.outputs.tag }}
          NEXT_VERSION: ${{ steps.semver.outputs.next_version }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.release_channel }}
          BUMP_KIND: ${{ steps.semver.outputs.bump }}
          SYNTHETIC_PER_COMMIT_RELEASE: ${{ steps.semver.outputs.synthetic_per_commit_release }}
          HEAD_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_SHA="$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")"
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "::error::Release tag ${RELEASE_TAG} already exists on ${TAG_SHA}, not ${HEAD_SHA}."
              exit 1
            fi
            echo "Tag ${RELEASE_TAG} already points at this commit."
          else
            git tag -a "${RELEASE_TAG}" "${HEAD_SHA}" -m "${RELEASE_TAG}"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi
          mkdir -p core/local/artifacts
          cat > core/local/artifacts/version_bump_release_handoff_current.json <<EOF
          {
            "ok": true,
            "type": "version_bump_release_handoff",
            "release_tag": "${RELEASE_TAG}",
            "next_version": "${NEXT_VERSION}",
            "channel": "${RELEASE_CHANNEL}",
            "bump_kind": "${BUMP_KIND}",
            "synthetic_per_commit_release": "${SYNTHETIC_PER_COMMIT_RELEASE}",
            "head_sha": "${HEAD_SHA}",
            "workflow": "${RUN_URL}",
            "release_publication_owner": ".github/workflows/release.yml",
            "assetless_release_creation_forbidden": true
          }
          EOF
          echo "Created/preserved tag ${RELEASE_TAG}. GitHub release publication is owned by release.yml so runtime assets cannot be bypassed."

      - name: Commit version files
        if: steps.semver.outputs.release_ready == '1' && steps.semver.outputs.dry_run != '1' && vars.INFRING_RELEASE_PERSIST_VERSION == '1'
        env:
          RELEASE_BOT_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_BOT_TOKEN:-}" ]; then
            echo "::error::REPO_ADMIN_TOKEN is required to persist version commits to protected main. Store a repo-admin or bypass-capable PAT as REPO_ADMIN_TOKEN, then rerun this workflow."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cargo run --quiet --manifest-path core/layer0/ops/Cargo.toml --bin infring-ops -- release-semver-contract run \
            --strict=1 \
            --write=1 \
            --channel=${{ steps.channel.outputs.release_channel }} \
            > core/local/artifacts/version_bump_persist_current.json
          git add package.json package-lock.json client/runtime/config/runtime_version.json
          if git diff --cached --quiet; then
            echo "No version files changed."
            exit 0
          fi
          git commit -m "chore(release): ${{ steps.semver.outputs.tag }}"
          git remote set-url origin "https://x-access-token:${RELEASE_BOT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:main
