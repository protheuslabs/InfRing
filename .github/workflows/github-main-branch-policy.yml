name: GitHub Main Branch Policy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-main-branch-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Apply required commit-prefix check to main
        env:
          GH_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_ADMIN_TOKEN:-}" ]; then
            echo "::error::Missing REPO_ADMIN_TOKEN secret. Store an admin-scoped GitHub PAT as REPO_ADMIN_TOKEN, then rerun this workflow."
            exit 1
          fi
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GH_REPO"]
          token = os.environ["GH_ADMIN_TOKEN"]
          owner, name = repo.split("/", 1)
          url = f"https://api.github.com/repos/{owner}/{name}/branches/main/protection"
          payload = {
              "required_status_checks": {
                  "strict": True,
                  "contexts": ["Conventional Commit Lint / conventional-commit-lint"],
              },
              "enforce_admins": True,
              "required_pull_request_reviews": None,
              "restrictions": None,
              "required_linear_history": True,
              "allow_force_pushes": False,
              "allow_deletions": False,
              "required_conversation_resolution": False,
          }
          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              method="PUT",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  body = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"branch protection update failed: HTTP {error.code}: {detail}")
          print(json.dumps({
              "ok": True,
              "repo": repo,
              "branch": "main",
              "required_status_checks": payload["required_status_checks"]["contexts"],
              "protected_url": body.get("url"),
          }, indent=2))
